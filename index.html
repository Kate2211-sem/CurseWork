<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация | Салон красоты OK!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-container">
    <h1 class="auth-title">Салон красоты OK!</h1>

    <!-- Переключатель Вход / Регистрация -->
    <div class="auth-tabs">
      <button class="tab active" data-tab="login">Вход</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>

    <!-- ================= ФОРМА ВХОДА ================= -->
    <form id="login-form" class="auth-form active">
      <div class="input-group">
        <label for="login-email">Email или телефон</label>
        <input type="text" id="login-email" name="login-email" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" name="login-password" required>
        <span class="error-message"></span>
      </div>

      <button type="submit" class="btn btn-primary">Войти</button>
    </form>

    <!-- ================= ФОРМА РЕГИСТРАЦИИ ================= -->
    <form id="register-form" class="auth-form">
      <div class="input-group">
        <label for="reg-phone">Телефон <span class="required">*</span></label>
        <input type="tel" id="reg-phone" name="reg-phone" placeholder="+375 (XX) XXX-XX-XX" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="reg-email">Email <span class="required">*</span></label>
        <input type="email" id="reg-email" name="reg-email" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="reg-dob">Дата рождения <span class="required">*</span></label>
        <input type="date" id="reg-dob" name="reg-dob" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="reg-fio">ФИО <span class="required">*</span></label>
        <input type="text" id="reg-fio" name="reg-fio" placeholder="Иванов Иван Иванович" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label>Способ создания пароля <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="pwd-mode" value="manual" checked> Ввести вручную</label>
          <label><input type="radio" name="pwd-mode" value="auto"> Сгенерировать автоматически</label>
        </div>
      </div>

      <div class="input-group">
        <label for="reg-password">Пароль <span class="required">*</span></label>
        <input type="password" id="reg-password" name="reg-password" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="reg-password-confirm">Повторите пароль <span class="required">*</span></label>
        <input type="password" id="reg-password-confirm" name="reg-password-confirm" required>
        <span class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="reg-nickname">Никнейм</label>
        <div class="nickname-group">
          <input type="text" id="reg-nickname" name="reg-nickname" readonly>
          <button type="button" class="btn-icon" id="refresh-nickname">🔄</button>
        </div>
        <span class="error-message"></span>
      </div>

      <div class="input-group checkbox-group">
        <label>
          <input type="checkbox" id="reg-agreement" name="reg-agreement" required>
          Я прочитал и согласен с <a href="#">условиями использования</a> <span class="required">*</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" disabled>Зарегистрироваться</button>
    </form>

    <!-- Ссылка для незарегистрированных пользователей -->
    <div class="guest-access">
      <p>Хотите просто посмотреть каталог и цены?</p>
      <a href="main.html" class="guest-link">Продолжить без регистрации</a>
    </div>
  </div>
</main>

</body>
</html>
